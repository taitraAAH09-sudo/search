<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>座位查詢</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #F7F6F3; --white: #FFFFFF; --ink: #1A1A1A; --ink-2: #4A4A4A; --ink-3: #8A8A8A;
  --rule: #E0DDD8; --accent: #1B4F8A; --accent-light: #EBF1F9;
  --green: #1A6B4A; --green-light: #E8F5EE;
  --gold: #8B6914; --gold-light: #FBF5E6;
  --red: #B33A2A;
}
body { font-family:"Noto Serif TC",serif; background:var(--bg); color:var(--ink); min-height:100vh; -webkit-font-smoothing:antialiased; }

.header { background:var(--accent); padding:20px 20px 16px; position:sticky; top:0; z-index:50; box-shadow:0 2px 12px rgba(0,0,0,0.15); }
.header-tag { font-family:"DM Mono",monospace; font-size:9px; letter-spacing:2px; color:rgba(255,255,255,0.55); text-transform:uppercase; margin-bottom:4px; }
.header-title { font-size:17px; font-weight:700; color:#fff; margin-bottom:12px; word-break:break-all; }
.conn-row { display:flex; align-items:center; gap:6px; margin-bottom:12px; }
.conn-dot { width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,0.3); transition:background .3s; }
.conn-dot.ok { background:#4ADE80; } .conn-dot.err { background:#F87171; }
.conn-lbl { font-family:"DM Mono",monospace; font-size:10px; color:rgba(255,255,255,0.6); }

.search-wrap { position:relative; }
.search-input { width:100%; padding:13px 44px; border-radius:10px; border:none; background:rgba(255,255,255,0.15); color:#fff; font-size:16px; font-family:"Noto Serif TC",serif; outline:none; transition:background .2s; }
.search-input::placeholder { color:rgba(255,255,255,0.45); }
.search-input:focus { background:rgba(255,255,255,0.22); }
.scan-btn2{width:100%;margin-top:8px;padding:12px;border:none;border-radius:10px;background:rgba(255,255,255,0.15);color:#fff;font-size:14.5px;font-weight:700;font-family:inherit;cursor:pointer;letter-spacing:0.05em;}
.scan-btn2:active{background:rgba(255,255,255,0.3);}
#scan-overlay{position:fixed;inset:0;background:rgba(15,28,42,0.88);z-index:99;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;color:#fff;font-size:15px;padding:24px;text-align:center;line-height:1.7;}
#scan-overlay.show{display:flex;}
.spinner{width:40px;height:40px;border:4px solid rgba(255,255,255,0.25);border-top-color:#fff;border-radius:50%;animation:spin .9s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.scan-src{font-size:12px;color:rgba(255,255,255,0.55);word-break:break-all;max-height:3.2em;overflow:hidden;}
#cam-overlay{position:fixed;inset:0;background:#000;z-index:98;display:none;}
#cam-overlay.show{display:block;}
#cam-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.cam-frame{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);width:86%;max-width:540px;aspect-ratio:2.6/1;border:2.5px solid rgba(255,255,255,0.95);border-radius:14px;box-shadow:0 0 0 200vmax rgba(0,0,0,0.55);overflow:hidden;}
.cam-frame::before,.cam-frame::after{content:'';position:absolute;width:26px;height:26px;border:4px solid #4ade80;}
.cam-frame::before{left:-2px;top:-2px;border-right:none;border-bottom:none;border-radius:12px 0 0 0;}
.cam-frame::after{right:-2px;bottom:-2px;border-left:none;border-top:none;border-radius:0 0 12px 0;}
.scanline{position:absolute;left:5%;right:5%;height:2.5px;background:linear-gradient(90deg,transparent,#4ade80 30%,#4ade80 70%,transparent);box-shadow:0 0 10px #4ade80;animation:scanmove 2s ease-in-out infinite;}
@keyframes scanmove{0%,100%{top:10%;}50%{top:86%;}}
.cam-hint{position:absolute;left:0;right:0;top:calc(40% + 14vw);max-width:100%;text-align:center;color:#fff;font-size:14.5px;text-shadow:0 1px 4px rgba(0,0,0,0.8);padding:0 20px;}
@media (min-width:640px){.cam-hint{top:calc(40% + 120px);}}
.cam-btns{position:absolute;bottom:36px;left:0;right:0;display:flex;gap:14px;justify-content:center;align-items:center;}
.cam-shoot{padding:15px 30px;border:none;border-radius:999px;background:#4ade80;color:#0f1c2a;font-weight:800;font-size:16.5px;font-family:inherit;cursor:pointer;box-shadow:0 4px 18px rgba(74,222,128,0.45);}
.cam-shoot:active{transform:scale(0.96);}
.cam-cancel{padding:14px 22px;border:1.5px solid rgba(255,255,255,0.55);border-radius:999px;background:transparent;color:#fff;font-size:15px;font-family:inherit;cursor:pointer;}
.s-icon { position:absolute; left:14px; top:50%; transform:translateY(-50%); font-size:17px; pointer-events:none; }
.clear-btn { position:absolute; right:12px; top:50%; transform:translateY(-50%); background:rgba(255,255,255,0.2); border:none; border-radius:50%; width:26px; height:26px; color:#fff; font-size:13px; cursor:pointer; display:none; align-items:center; justify-content:center; }
.clear-btn.show { display:flex; }

.stats-bar { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; padding:14px 16px; background:var(--white); border-bottom:1px solid var(--rule); }
@media(min-width:480px){ .stats-bar { grid-template-columns:repeat(4,1fr); } }
.stat { background:var(--bg); border-radius:10px; padding:10px 12px; text-align:center; border:1px solid var(--rule); }
.stat-num { font-family:"DM Mono",monospace; font-size:20px; font-weight:700; }
.stat-lbl { font-size:10px; color:var(--ink-3); margin-top:1px; }

.hint { padding:48px 20px; text-align:center; color:var(--ink-3); font-size:14px; line-height:1.8; }
.hint-icon { font-size:42px; margin-bottom:12px; }

.result-count { font-family:"DM Mono",monospace; font-size:11px; color:var(--ink-3); padding:12px 16px 6px; }
.result-list { padding:0 16px 32px; display:flex; flex-direction:column; gap:10px; }

.result-card { background:var(--white); border-radius:12px; padding:14px 16px; display:flex; align-items:center; gap:14px; box-shadow:0 1px 4px rgba(0,0,0,0.06); border:1px solid var(--rule); animation:slideIn .18s ease; }
.result-card.is-checked { opacity:0.55; }
@keyframes slideIn { from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;} }

.seat-badge { flex-shrink:0; width:56px; height:56px; border-radius:10px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; }
.badge-blue { background:var(--accent-light); } .badge-blue .badge-zone { color:var(--accent); }
.badge-green { background:var(--green-light); } .badge-green .badge-zone { color:var(--green); }
.badge-gold { background:var(--gold-light); } .badge-gold .badge-zone { color:var(--gold); }
.badge-zone { font-family:"DM Mono",monospace; font-size:13px; font-weight:700; line-height:1.2; text-align:center; }
.badge-seat { font-family:"DM Mono",monospace; font-size:10px; color:var(--ink-3); }

.card-info { flex:1; min-width:0; }
.card-name { font-size:14px; font-weight:700; line-height:1.4; color:var(--ink); margin-bottom:4px; }
.card-name mark { background:#FEF08A; color:var(--ink); border-radius:2px; padding:0 1px; }
.card-seat { font-family:"DM Mono",monospace; font-size:11px; color:var(--ink-3); }
.card-zone { font-size:11px; color:var(--ink-3); margin-top:2px; }
.match-tag{display:inline-block;font-family:"DM Mono",monospace;font-size:9px;font-weight:700;padding:1px 6px;border-radius:20px;margin-left:6px;vertical-align:middle;white-space:nowrap;}
.match-tag.high{background:var(--green-light);color:var(--green);}
.match-tag.mid{background:var(--accent-light);color:var(--accent);}
.match-tag.low{background:var(--gold-light);color:var(--gold);}

.checkin-btn { flex-shrink:0; padding:8px 12px; border-radius:8px; border:1.5px solid var(--green); background:var(--green-light); color:var(--green); font-size:12px; font-weight:700; cursor:pointer; font-family:"Noto Serif TC",serif; white-space:nowrap; transition:all .15s; }
.checkin-btn:hover { background:var(--green); color:#fff; }
.checkin-btn.done { background:#D1FAE5; border-color:#6EE7B7; color:#065F46; cursor:default; }

.no-result { padding:40px 20px; text-align:center; color:var(--ink-3); font-size:14px; }
.error-box { padding:60px 24px; text-align:center; }
.error-icon { font-size:48px; margin-bottom:16px; }
.error-title { font-size:16px; font-weight:700; color:var(--red); margin-bottom:8px; }
.error-msg { font-size:13px; color:var(--ink-3); line-height:1.7; }

.footer { text-align:center; padding:20px; font-family:"DM Mono",monospace; font-size:10px; color:var(--ink-3); border-top:1px solid var(--rule); margin-top:8px; letter-spacing:.5px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-tag">TAITRA · Event Lookup</div>
  <div class="header-title" id="event-title">座位查詢系統</div>
  <div class="conn-row">
    <div class="conn-dot" id="conn-dot"></div>
    <div class="conn-lbl" id="conn-lbl">連線中…</div>
  </div>
  <div class="search-wrap">
    <span class="s-icon">🔍</span>
    <input type="text" class="search-input" id="search"
      placeholder="搜尋姓名、單位或座位編號…（可用空格分隔多個關鍵字）"
      oninput="doSearch()" autocomplete="off"
      autocorrect="off" autocapitalize="off" spellcheck="false" inputmode="search" />
    <button class="clear-btn" id="clear-btn" onclick="clearSearch()">✕</button>
  </div>
  <button class="scan-btn2" onclick="startScan()">📷 相機掃描名牌／名片 找座位</button>
  <input type="file" id="scan-input" accept="image/*" capture="environment" style="display:none"
    onchange="handleScanFile(this.files[0])">
</div>

<div id="scan-overlay">
  <div class="spinner"></div>
  <div id="scan-status">準備中…</div>
</div>

<div id="cam-overlay">
  <video id="cam-video" autoplay playsinline muted></video>
  <div class="cam-frame"><div class="scanline"></div></div>
  <div class="cam-hint">將賓客<b>姓名</b>對準框內，靠近、對正、光線充足</div>
  <div class="cam-btns">
    <button class="cam-cancel" onclick="stopCamera()">✕ 取消</button>
    <button class="cam-shoot" onclick="captureFrame()">📸 辨識框內文字</button>
  </div>
</div>

<div class="stats-bar" id="stats-bar" style="display:none">
  <div class="stat">
    <div class="stat-num" id="st-checkin" style="color:var(--green);">0%</div>
    <div class="stat-lbl">整體報到率</div>
    <div style="font-family:'DM Mono',monospace;font-size:10px;color:var(--ink-3);margin-top:2px;" id="st-checkin-sub">0 / 0</div>
  </div>
  <div class="stat">
    <div class="stat-num" id="st-ceremony" style="color:#E11D48;">0%</div>
    <div class="stat-lbl">合影貴賓報到率</div>
    <div style="font-family:'DM Mono',monospace;font-size:10px;color:var(--ink-3);margin-top:2px;" id="st-ceremony-sub">0 / 0</div>
  </div>
  <div class="stat">
    <div class="stat-num" id="st-empty" style="color:var(--gold);">0</div>
    <div class="stat-lbl">空位數</div>
  </div>
  <div class="stat">
    <div class="stat-num" id="st-total" style="color:var(--accent);">0</div>
    <div class="stat-lbl">總席數</div>
  </div>
</div>

<div style="padding:0 16px 14px;background:var(--white);border-bottom:1px solid var(--rule);">
  <button onclick="exportCheckinReport()"
    style="width:100%;padding:13px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Noto Serif TC',serif;display:flex;align-items:center;justify-content:center;gap:8px;">
    📋 一鍵生成報到報告表
  </button>
</div>

<div id="main">
  <div class="hint"><div class="hint-icon">⏳</div><div>載入資料中…</div></div>
</div>

<div class="footer" id="footer">TAITRA · 座位查詢系統</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import{getDatabase,ref,onValue}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

const fb=initializeApp({
  apiKey:"AIzaSyCo2eMHEHEfBQfWiVmQ6PhUsdeIM6eb57Q",
  authDomain:"taitra-table.firebaseapp.com",
  databaseURL:"https://taitra-table-default-rtdb.firebaseio.com",
  projectId:"taitra-table",
  storageBucket:"taitra-table.firebasestorage.app",
  messagingSenderId:"802855818617",
  appId:"1:802855818617:web:b7cf3b45e13b70ae660ba8"
},'lookup-dynamic');

const db=getDatabase(fb);
const DB_URL="https://taitra-table-default-rtdb.firebaseio.com";

// 從網址讀取活動代碼：?event=EVENT_xxx
const params=new URLSearchParams(window.location.search);
const PROJECT_ID=params.get('event');

if(!PROJECT_ID){
  document.getElementById('main').innerHTML=`
    <div class="error-box">
      <div class="error-icon">🔗</div>
      <div class="error-title">缺少活動參數</div>
      <div class="error-msg">請從前台系統點擊「🔍 手機查詢」按鈕進入，<br>或確認網址包含 ?event=活動代碼</div>
    </div>`;
  document.getElementById('conn-lbl').textContent='等待活動參數';
  throw new Error('No event param');
}

document.getElementById('event-title').textContent = PROJECT_ID.replace(/^EVENT_/,'').replace(/_/g,' ');
document.title = PROJECT_ID.replace(/^EVENT_/,'').replace(/_/g,' ') + ' · 座位查詢';

let DATA={}, TAGS={}, CHECKINS={}, TABLE_NAMES={};
let loaded=false;

function setConn(ok){
  const dot=document.getElementById('conn-dot');
  const lbl=document.getElementById('conn-lbl');
  if(ok){dot.className='conn-dot ok';lbl.textContent='已連線 · 即時同步';}
  else{dot.className='conn-dot err';lbl.textContent='連線失敗';}
}

function updateStats(){
  const total=Object.keys(DATA).length;
  const filled=Object.values(DATA).filter(v=>v).length;
  const checkinCount=Object.keys(CHECKINS).length;
  const empty=total-filled;

  const ceremonySeats=Object.keys(TAGS).filter(c=>TAGS[c]==='ceremony'||TAGS[c]==='photo');
  const ceremonyCheckin=ceremonySeats.filter(c=>CHECKINS[c]).length;
  const ceremonyTotal=ceremonySeats.length;

  const checkinPct=filled>0?Math.round(checkinCount/filled*100):0;
  const ceremonyPct=ceremonyTotal>0?Math.round(ceremonyCheckin/ceremonyTotal*100):0;

  document.getElementById('st-total').textContent=total;
  document.getElementById('st-empty').textContent=empty;
  document.getElementById('st-checkin').textContent=checkinPct+'%';
  document.getElementById('st-checkin-sub').textContent=checkinCount+' / '+filled;
  document.getElementById('st-ceremony').textContent=ceremonyPct+'%';
  document.getElementById('st-ceremony-sub').textContent=ceremonyCheckin+' / '+ceremonyTotal;
  document.getElementById('stats-bar').style.display='';

  const now=new Date();
  document.getElementById('footer').textContent=
    PROJECT_ID+' · 最後同步 '+
    now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
}

onValue(ref(db,PROJECT_ID+'/seats_master2026'),snap=>{
  DATA={};
  const d=snap.val()||{};
  Object.entries(d).forEach(([c,n])=>DATA[c]=n||'');
  if(loaded){ updateStats(); doSearch(); }
},()=>setConn(false));

onValue(ref(db,PROJECT_ID+'/assignments2026'),snap=>{
  const d=snap.val()||{};
  Object.entries(d).forEach(([c,n])=>{ if(n) DATA[c]=n; });
  if(loaded){ updateStats(); doSearch(); }
});

onValue(ref(db,PROJECT_ID+'/tags2026'),snap=>{
  TAGS={};
  const d=snap.val()||{};
  Object.entries(d).forEach(([c,t])=>{ TAGS[c]=t; });
  if(loaded) updateStats();
});

onValue(ref(db,PROJECT_ID+'/table_names2026'),snap=>{
  TABLE_NAMES={};
  const d=snap.val()||{};
  Object.entries(d).forEach(([c,v])=>{ TABLE_NAMES[c]=v; });
  if(loaded) doSearch();
});

onValue(ref(db,PROJECT_ID+'/checkins2026'),snap=>{
  CHECKINS={};
  const d=snap.val()||{};
  Object.entries(d).forEach(([c,v])=>{ CHECKINS[c]=v; });
  loaded=true;
  setConn(true);
  updateStats();
  doSearch();
},()=>{
  loaded=true;
  setConn(false);
});

function parseSeatCode(code){
  // 主桌：H1-3（自訂名稱優先）
  const mh=code.match(/^(H\d+)-(\d+)$/);
  if(mh){
    const [,tCode,seat]=mh;
    const customName=TABLE_NAMES[tCode]?TABLE_NAMES[tCode].replace(/\.+$/,'').trim():null;
    const tableLabel=customName?`第 ${customName} 桌`:'主桌';
    const badgeLabel=customName?`第${customName}桌`:'主桌';
    return { detail:`${tableLabel}・第 ${seat} 席`, badgeTop:badgeLabel, badgeBot:`第${seat}席`, color:'gold' };
  }
  // 圓桌：R1_T2-5（用自訂桌名顯示）
  const m=code.match(/^R(\d+)_T(\d+)-(\d+)$/);
  if(m){
    const [,row,table,seat]=m;
    const tCode=code.split('-')[0];
    const customName=TABLE_NAMES[tCode]?TABLE_NAMES[tCode].replace(/\.+$/,'').trim():null;
    const tableLabel=customName?`第 ${customName} 桌`:`第 ${table} 桌`;
    const badgeLabel=customName?`第${customName}桌`:`第${table}桌`;
    return { detail:`${tableLabel}・第 ${seat} 席`, badgeTop:badgeLabel, badgeBot:`第${seat}席`, color:'blue' };
  }
  // 方陣：A1-3
  const m2=code.match(/^([A-Za-z]+)(\d+)-(\d+)$/);
  if(m2){
    const [,zone,row,seat]=m2;
    return { detail:`${zone} 區・第 ${row} 排・第 ${seat} 席`, badgeTop:zone, badgeBot:`${row}排${seat}席`, color: zone==='A'?'blue':zone==='B'?'green':'gold' };
  }
  return { detail:code, badgeTop:code, badgeBot:'', color:'blue' };
}

window.doSearch=function(){
  const kw=(document.getElementById('search').value||'').trim();
  document.getElementById('clear-btn').classList.toggle('show',kw.length>0);
  const main=document.getElementById('main');

  if(!loaded) return;

  if(!kw){
    main.innerHTML='<div class="hint"><div class="hint-icon">🔍</div><div>輸入姓名、單位或座位編號<br>即可查詢</div></div>';
    return;
  }

  // 支援空格分隔多個關鍵字（例如「台達 王」），每個字詞都要命中才算符合（AND 邏輯）
  const terms=kw.toLowerCase().split(/\s+/).filter(Boolean);
  const results=Object.entries(DATA).filter(([code,name])=>{
    const codeL=code.toLowerCase();
    const nameL=(name||'').toLowerCase();
    return terms.every(t=>codeL.includes(t)||nameL.includes(t));
  });

  if(!results.length){
    main.innerHTML=`<div class="no-result">🔍 找不到「${kw}」相關座位</div>`;
    return;
  }

  const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const kwE=terms.map(esc).join('|');
  const re=new RegExp(`(${kwE})`,'gi');

  let html=`<div class="result-count">找到 ${results.length} 筆結果</div><div class="result-list">`;
  results.forEach(([code,name])=>{
    const p=parseSeatCode(code);
    const hn=name?name.replace(re,'<mark>$1</mark>'):'（空位）';
    const hc=code.replace(re,'<mark>$1</mark>');
    html+=`<div class="result-card ${CHECKINS[code]?'is-checked':''}">
      <div class="seat-badge badge-${p.color}">
        <div class="badge-zone">${p.badgeTop}</div>
        <div class="badge-seat">${p.badgeBot}</div>
      </div>
      <div class="card-info">
        <div class="card-name">${hn}</div>
        <div class="card-seat">座位編號：${hc}</div>
        <div class="card-zone">${p.detail}</div>
      </div>
      <button class="checkin-btn ${CHECKINS[code]?'done':''}"
        onclick="toggleCheckin('${code}',${!CHECKINS[code]})">
        ${CHECKINS[code]?'✅ 已報到':'報到'}
      </button>
    </div>`;
  });
  html+='</div>';
  main.innerHTML=html;
};

window.toggleCheckin=async function(code, checkIn){
  const now=new Date();
  const time=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
  const url=`${DB_URL}/${PROJECT_ID}/checkins2026/${code}.json`;
  if(checkIn){
    await fetch(url,{method:'PUT',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({time,name:DATA[code]||''})});
  }else{
    await fetch(url,{method:'DELETE'});
  }
};

function parseSeatLabel(code){
  const mh=code.match(/^(H\d+)-(\d+)$/);
  if(mh){
    const customName=TABLE_NAMES[mh[1]]?TABLE_NAMES[mh[1]].replace(/\.+$/,'').trim():null;
    return customName?`第${customName}桌 第${mh[2]}席`:`主桌 第${mh[2]}席`;
  }
  const m=code.match(/^R(\d+)_T(\d+)-(\d+)$/);
  if(m){
    const tCode=code.split('-')[0];
    const customName=TABLE_NAMES[tCode]?TABLE_NAMES[tCode].replace(/\.+$/,'').trim():null;
    return customName?`第${customName}桌 第${m[3]}席`:`第${m[2]}桌 第${m[3]}席`;
  }
  const m2=code.match(/^([A-Za-z]+)(\d+)-(\d+)$/);
  if(m2) return `${m2[1]}區 第${m2[2]}排 第${m2[3]}席`;
  return code;
}

/* ── 📷 相機掃描名牌：拍照 → 文字辨識(OCR) → 與座位資料模糊比對 ── */
let _tessLoading=null;
function loadTesseract(){
  if(window.Tesseract) return Promise.resolve();
  if(_tessLoading) return _tessLoading;
  _tessLoading=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.1.1/tesseract.min.js';
    s.onload=res;
    s.onerror=()=>rej(new Error('辨識引擎載入失敗，請確認網路'));
    document.head.appendChild(s);
  });
  return _tessLoading;
}
function downscaleImage(file,maxSide){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      const sc=Math.min(1,maxSide/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(img.src);
      res(c);
    };
    img.src=URL.createObjectURL(file);
  });
}
/* 影像前處理：解析度不足時放大、轉灰階、Otsu自動二值化，讓文字在各種名牌顏色/材質/光線下更容易被辨識 */
function preprocessForOcr(canvas){
  let src=canvas;
  const minW=1000; // 解析度過低是辨識不準最常見的原因，先放大再處理
  if(src.width<minW){
    const scale=minW/src.width;
    const up=document.createElement('canvas');
    up.width=Math.round(src.width*scale);
    up.height=Math.round(src.height*scale);
    const uctx=up.getContext('2d');
    uctx.imageSmoothingEnabled=true;
    uctx.imageSmoothingQuality='high';
    uctx.drawImage(src,0,0,up.width,up.height);
    src=up;
  }
  const ctx=src.getContext('2d');
  const imgData=ctx.getImageData(0,0,src.width,src.height);
  const d=imgData.data;
  const n=src.width*src.height;
  const gray=new Uint8ClampedArray(n);
  const hist=new Array(256).fill(0);
  for(let i=0,p=0;i<d.length;i+=4,p++){
    const g=(0.299*d[i]+0.587*d[i+1]+0.114*d[i+2])|0;
    gray[p]=g; hist[g]++;
  }
  // Otsu 自動找出最佳黑白分界閾值（比固定閾值更適應不同光線/名牌底色）
  let sum=0; for(let t=0;t<256;t++) sum+=t*hist[t];
  let sumB=0,wB=0,wF=0,maxVar=0,threshold=140;
  for(let t=0;t<256;t++){
    wB+=hist[t]; if(wB===0) continue;
    wF=n-wB; if(wF===0) break;
    sumB+=t*hist[t];
    const mB=sumB/wB, mF=(sum-sumB)/wF;
    const between=wB*wF*(mB-mF)*(mB-mF);
    if(between>maxVar){ maxVar=between; threshold=t; }
  }
  for(let i=0,p=0;i<d.length;i+=4,p++){
    const v=gray[p]>threshold?255:0;
    d[i]=d[i+1]=d[i+2]=v;
  }
  ctx.putImageData(imgData,0,0);
  return src;
}

/* 共用 OCR 流程：輸入 canvas 或圖檔 → 辨識 → 模糊比對結果 */
let _ocrWorker=null;
async function runOcr(input){
  const ov=document.getElementById('scan-overlay');
  const st=document.getElementById('scan-status');
  ov.classList.add('show');
  st.innerHTML='準備辨識引擎…<br><span style="font-size:12px;opacity:.7;">首次使用需下載中文辨識資料（約10~30秒），之後會快很多</span>';
  try{
    await loadTesseract();
    const proc=preprocessForOcr(input);
    if(!_ocrWorker){
      _ocrWorker=await Tesseract.createWorker('chi_tra+eng',1,{
        logger:m=>{
          if(m.status==='recognizing text') st.textContent='辨識中… '+Math.round((m.progress||0)*100)+'%';
          else st.textContent='載入辨識資料…';
        }
      });
      // 名牌/名片通常是單一區塊的文字，指定版面分析模式可大幅減少誤判、拼字亂序的情況
      await _ocrWorker.setParameters({
        tessedit_pageseg_mode:Tesseract.PSM.SINGLE_BLOCK,
        preserve_interword_spaces:'1'
      });
    }
    const {data}=await _ocrWorker.recognize(proc);
    ov.classList.remove('show');
    renderScanResults((data.text||'').replace(/\s+/g,''));
  }catch(e){
    ov.classList.remove('show');
    alert('掃描失敗：'+(e.message||e));
  }
}

/* 頁面內即時相機（QR掃描式取景框）；無法開啟時自動退回拍照模式 */
let camStream=null;
window.startScan=async function(){
  try{
    camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
    document.getElementById('cam-video').srcObject=camStream;
    document.getElementById('cam-overlay').classList.add('show');
  }catch(e){
    // 使用者拒絕權限或裝置不支援 → 退回原本的拍照上傳
    document.getElementById('scan-input').click();
  }
};
window.stopCamera=function(){
  if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null;}
  document.getElementById('cam-overlay').classList.remove('show');
};
window.captureFrame=async function(){
  const v=document.getElementById('cam-video');
  if(!v.videoWidth) return;
  // 把畫面上取景框的位置換算回相機原始解析度，只裁切框內區域來辨識（更準）
  const frame=document.querySelector('.cam-frame');
  const vw=v.videoWidth, vh=v.videoHeight;
  const elW=v.clientWidth, elH=v.clientHeight;
  const scale=Math.max(elW/vw, elH/vh); // object-fit:cover 的縮放比
  const offX=(vw*scale-elW)/2, offY=(vh*scale-elH)/2;
  const r=frame.getBoundingClientRect(), vr=v.getBoundingClientRect();
  const sx=Math.max(0,(r.left-vr.left+offX)/scale);
  const sy=Math.max(0,(r.top-vr.top+offY)/scale);
  const sw=Math.min(vw-sx, r.width/scale);
  const sh=Math.min(vh-sy, r.height/scale);
  const outScale=Math.min(1, 1400/sw);
  const c=document.createElement('canvas');
  c.width=Math.round(sw*outScale); c.height=Math.round(sh*outScale);
  c.getContext('2d').drawImage(v, sx, sy, sw, sh, 0, 0, c.width, c.height);
  stopCamera();
  await runOcr(c);
};

/* 拍照上傳模式（退路） */
window.handleScanFile=async function(file){
  if(!file) return;
  const canvas=await downscaleImage(file,1400);
  await runOcr(canvas);
  document.getElementById('scan-input').value='';
};
const _cjk=ch=>/[\u4e00-\u9fff]/.test(ch);
function fuzzyScore(name,text){
  let hit=0,bi=0;
  const seen=new Set();
  [...name].forEach(ch=>{
    if(_cjk(ch)&&!seen.has(ch)&&text.includes(ch)){hit++;seen.add(ch);}
  });
  for(let i=0;i<name.length-1;i++){
    const b=name.substr(i,2);
    if(_cjk(b[0])&&_cjk(b[1])&&text.includes(b)) bi++;
  }
  return hit+bi*2; // 連續兩字相符加重計分
}
function renderScanResults(text){
  const main=document.getElementById('main');
  const preview=text?text.slice(0,60):'';
  if(!text){
    main.innerHTML='<div class="no-result">📷 沒有辨識到文字，請靠近一點、對準名字再拍一次</div>';
    return;
  }
  const scored=Object.entries(DATA)
    .filter(([c,n])=>n)
    .map(([code,name])=>({code,name,score:fuzzyScore(name,text)}))
    .filter(x=>x.score>=1)   // 放寬門檻：只要沾到一個字就先列出來，依相似度排序讓使用者自己判斷
    .sort((a,b)=>b.score-a.score)
    .slice(0,15);
  if(!scored.length){
    main.innerHTML=`<div class="no-result">📷 辨識到「${preview}」<br>但找不到相符的賓客，請改用手動搜尋</div>`;
    return;
  }
  let html=`<div class="result-count">📷 掃描比對結果：${scored.length} 筆，依相似度排序（辨識文字：${preview}${text.length>60?'…':''}）</div><div class="result-list">`;
  scored.forEach(({code,name,score})=>{
    const p=parseSeatCode(code);
    const hn=[...name].map(ch=>(_cjk(ch)&&text.includes(ch))?`<mark>${ch}</mark>`:ch).join('');
    const tag=score>=4?'<span class="match-tag high">高相似</span>'
      :score>=2?'<span class="match-tag mid">中相似</span>'
      :'<span class="match-tag low">可能相關</span>';
    html+=`<div class="result-card ${CHECKINS[code]?'is-checked':''}">
      <div class="seat-badge badge-${p.color}">
        <div class="badge-zone">${p.badgeTop}</div>
        <div class="badge-seat">${p.badgeBot}</div>
      </div>
      <div class="card-info">
        <div class="card-name">${hn}${tag}</div>
        <div class="card-seat">座位編號：${code}</div>
        <div class="card-zone">${p.detail}</div>
      </div>
      <button class="checkin-btn ${CHECKINS[code]?'done':''}"
        onclick="toggleCheckin('${code}',${!CHECKINS[code]})">
        ${CHECKINS[code]?'✅ 已報到':'報到'}
      </button>
    </div>`;
  });
  html+='</div>';
  main.innerHTML=html;
}

  document.getElementById('search').value='';
  document.getElementById('clear-btn').classList.remove('show');
  doSearch();
  document.getElementById('search').focus();
};
